name: build_cv
description: CV builder app with 10 templates using Flutter MVVM, GetX, and SQLite.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  sqflite: ^2.3.3+1
  path: ^1.9.0

flutter:
  uses-material-design: true
